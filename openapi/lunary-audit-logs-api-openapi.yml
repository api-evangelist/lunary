openapi: 3.2.0
info:
  title: Lunary Audit Logs API
  description: 'REST API for Lunary, an open-source LLM observability and evaluation

    platform.'
  version: '1.0'
  contact:
    name: Lunary
    url: https://docs.lunary.ai/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://api.lunary.ai
  description: Lunary Cloud
security:
- ProjectPrivateApiKeyAuth: []
tags:
- name: Audit Logs
paths:
  /v1/audit-logs:
    get:
      tags:
      - Audit Logs
      summary: List audit logs
      operationId: listAuditLogs
      responses:
        '200':
          description: Audit logs
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    ProjectPrivateApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: Lunary project private API key (UUID)
    ProjectPublicApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: Lunary project public API key (UUID)
    OrgApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: Lunary organization API key (UUID)
